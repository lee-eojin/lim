name: Bug report
description: A LIM plugin does not work as documented.
labels: [bug]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin and version
      placeholder: review-loop 0.1.0
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
